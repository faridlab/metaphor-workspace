# Single-host beta stack for __project__.
#
# This is the PROD/UAT stack. Local dev uses deployment/compose.dev.yaml
# instead — selected automatically by `metaphor docker up --env dev` via
# metaphor.deploy.yaml.
#
# Networks:
#   edge          — caddy-facing; only services Caddy reverse-proxies to.
#   backend       — private; service + postgres + redis + minio.
#   observability — private; monitoring stack.
#
# Conventions:
#   - Image tags pinned via ${*_TAG} in .env.prod (git SHA). `:beta` is a
#     human-moving pointer, never what compose reads.
#   - No host ports on data stores. All inter-container traffic stays on
#     private networks.
#   - restart: unless-stopped everywhere so `reboot` brings the stack back.

# Project name. Without this, docker compose defaults to the directory it
# was invoked from (`deployment-`), which leaks the deployment-folder name
# into every container/network/volume identifier. Set it explicitly so the
# stack is named after the workspace regardless of cwd or compose file path.
name: __project__-metaphora

services:
  # ───── Data stores ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16.16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    # Tuned for a 16 GB single-host deployment shared with redis, minio,
    # the service, frontends, and the full observability stack. Postgres
    # gets ~1/8 of host RAM as shared_buffers and assumes ~3/8 available
    # in OS page cache. Retune when postgres moves to its own box.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    environment:
      # Compose substitution errors out if these are unset/blank in .env.prod.
      # Subsequent ${POSTGRES_*} references in this file rely on the same
      # values; the strictness here is enough — if missing, deploy aborts.
      POSTGRES_USER: ${POSTGRES_USER:?must be set in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set in .env.prod (long random string)}
      POSTGRES_DB: ${POSTGRES_DB:?must be set in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    # Bind 5432 to localhost ONLY on the host. Internet-unreachable
    # (UFW + 127.0.0.1 binding); only accessible via SSH tunnel from a
    # laptop. Required for DBeaver / psql / metaphor-migration access.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # Valkey: the BSD-3 Linux Foundation fork of Redis 7.2, wire-compatible with
    # Redis clients (REDIS_URL and the `redis` crate keep working). Redis 7.4+
    # images are RSALv2/SSPL, which is not an open source license.
    image: valkey/valkey:9.2.0-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    # Object storage. The service keeps the name `minio` as a role name so
    # Caddy, backups, chaos experiments and the MINIO_* env contract stay
    # unchanged; the server is RustFS (Apache-2.0, S3- and `mc admin`-
    # compatible). MinIO Community stopped publishing images in Oct 2025 and
    # its repository is archived, so it no longer receives security fixes.
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    restart: unless-stopped
    command: ["server", "--console-enable", "/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?must be set in .env.prod}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?must be set in .env.prod (long random string)}
    volumes:
      - miniodata:/data
    networks: [backend, edge]
    ports:
      # Console bound to localhost only — SSH-tunnel to reach it.
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  # One-shot object-storage bootstrap: `__project__-service storage-init`
  # (backbone_bucket::provision), the same image and pattern as `migrations`.
  # Runs once per `up` and exits 0. It creates the private and public buckets,
  # gives the public one anonymous read, and creates the least-privilege
  # service user (MINIO_ACCESS_KEY / MINIO_SECRET_KEY from
  # apps/__project__-service/.env.prod) with the `__project__-svc` policy on
  # those two buckets only. Idempotent; a changed MINIO_SECRET_KEY rotates
  # the user's key on the next run. The root keys live in this job only,
  # never in the service.
  minio-init:
    image: ghcr.io/faridlab/__project__-service:${SERVICE_TAG:?SERVICE_TAG must be pinned in .env.prod (e.g. v0.5.2 from CI). See .env.prod.example.}
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ../apps/__project__-service/.env.prod
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:?must be set in .env.prod}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:?must be set in .env.prod}
      MINIO_SERVICE_POLICY: __project__-svc
    networks: [backend]
    command: ["storage-init"]
    restart: "no"

  # ───── App ─────────────────────────────────────────────────────────────
  # Migrations (one-shot). Runs `__project__-service migrate` which discovers
  # paired `<ts>_<name>.{up,down}.sql` files under /app/migrations, applies
  # each pending one in a transaction, and records it in
  # `schema_migrations`. Exits 0 on success — __project__-service depends on
  # this with `service_completed_successfully` and the binary itself
  # enforces a `MIGRATIONS_STRICT` startup gate that refuses to serve
  # traffic against an unmigrated schema.
  migrations:
    image: ghcr.io/faridlab/__project__-service:${SERVICE_TAG:?SERVICE_TAG must be pinned in .env.prod (e.g. v0.5.2 from CI). See .env.prod.example.}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../apps/__project__-service/.env.prod
    environment:
      APP_ENV: prod
      # Config loader picks the overlay by RUST_ENV (not APP_ENV) — keep both
      # in sync. Without RUST_ENV, application-prod.yml is silently skipped.
      RUST_ENV: prod
      # Same construction as __project__-service below — without this the
      # migrate binary has no way to find the postgres container (would
      # default to localhost inside its own container = no postgres).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks: [backend]
    command: ["migrate"]
    restart: "no"

  __project__-service:
    image: ghcr.io/faridlab/__project__-service:${SERVICE_TAG:?SERVICE_TAG must be pinned in .env.prod (e.g. v0.5.2 from CI). See .env.prod.example.}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    env_file:
      # Only the service-owned runtime file; see the explicit values below.
      - ../apps/__project__-service/.env.prod
      # OpenAPI/Swagger UI is absent from this image unless it was built with
      # `--build-arg CARGO_FEATURES=openapi`. When it IS, set SWAGGER_UI_USER +
      # SWAGGER_UI_PASSWORD in ../apps/__project__-service/.env.prod to gate
      # /swagger-ui + /api-docs/* (they flow in via the env_file above).
    environment:
      APP_ENV: prod
      # Config loader picks the overlay by RUST_ENV (not APP_ENV) — keep both
      # in sync. Without RUST_ENV, application-prod.yml is silently skipped.
      RUST_ENV: prod
      HOST: 0.0.0.0
      PORT: "3000"
      METRICS_ENABLED: "true"
      METRICS_PORT: "9090"
      # Caddy terminates TLS and reverse-proxies to this container; trust
      # the X-Forwarded-For / X-Real-IP headers it sets so audit logs and
      # per-IP login throttle see the real client IP, not Caddy's.
      TRUST_PROXY_HEADERS: "true"
      # Belt-and-braces with the `migrations` one-shot above. Refuses to
      # start if any migration is pending — see migrate service notes.
      MIGRATIONS_STRICT: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: https://s3.${DOMAIN:?must be set in .env.prod (apex domain, e.g. __project__.com)}
      # Values the service needs from the orchestration file, passed one by one so
      # its root and admin secrets (RustFS root keys, Postgres and Grafana admin
      # passwords) never reach this container.
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
    networks: [edge, backend, observability]
    healthcheck:
      test: ["CMD", "/app/__project__-service", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ───── Frontends ──────────────────────────────────────────────────────
  __project__-webapp-customer:
    image: ghcr.io/faridlab/__project__-webapp-customer:${WEBAPP_CUSTOMER_TAG:?WEBAPP_CUSTOMER_TAG must be pinned in .env.prod (e.g. v0.3.1 from CI). See .env.prod.example.}
    restart: unless-stopped
    networks: [edge]

  __project__-webapp-provider:
    image: ghcr.io/faridlab/__project__-webapp-provider:${WEBAPP_PROVIDER_TAG:?WEBAPP_PROVIDER_TAG must be pinned in .env.prod (e.g. v0.3.1 from CI). See .env.prod.example.}
    restart: unless-stopped
    networks: [edge]

  __project__-webapp-admin:
    image: ghcr.io/faridlab/__project__-webapp-admin:${WEBAPP_ADMIN_TAG:?WEBAPP_ADMIN_TAG must be pinned in .env.prod (e.g. v0.3.1 from CI). See .env.prod.example.}
    restart: unless-stopped
    networks: [edge]

  __project__-webapp-download:
    image: ghcr.io/faridlab/__project__-webapp-download:${WEBAPP_DOWNLOAD_TAG:?WEBAPP_DOWNLOAD_TAG must be pinned in .env.prod (e.g. v0.3.1 from CI). See .env.prod.example.}
    restart: unless-stopped
    networks: [edge]

  # ───── Edge ────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    depends_on:
      - __project__-service
      - minio
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?must be set in .env.prod (Let's Encrypt notification email)}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

  # ───── Monitoring ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [observability]

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks: [observability]

  # Ships every container's stdout/stderr to Loki. Grafana Alloy replaces
  # Promtail, which reached end of life on 2026-03-02; the labels (container,
  # service, stream) are the same, so Loki queries and alerts are unchanged.
  alloy:
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [observability]
    depends_on: [loki]

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?must be set in .env.prod (Grafana login password)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      # Grafana wants host:port here; SMTP_HOST alone would make it dial port 25.
      GF_SMTP_HOST: ${SMTP_HOST:-}:${SMTP_PORT:-587}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${EMAIL_FROM:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks: [edge, observability]

  cadvisor:
    # Releases from v0.53.0 on are published to ghcr.io only.
    image: ghcr.io/google/cadvisor:v0.61.1@sha256:4929b70e82079d001d0028b85d6a4dd25ad4666b719455c9542b983489963916
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [observability]

  node-exporter:
    image: prom/node-exporter:v1.13.1@sha256:7296504d4ada44b7d7ab4431e27e9f9900d8488f8d55842f4b12ae2704e16dfe
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [observability]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.21.1@sha256:3b8e05a84282cd1199ad2fb6c66f362738bf4c68c1547d8f4226a34a7dd6d8d7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks: [backend, observability]

  uptime-kuma:
    # 2.x: Debian 12 / Node 22 (1.x ran on end-of-life Debian 10 / Node 18). An existing
    # 1.x volume migrates on first start; SQLite is preselected so a fresh install
    # does not stop at the browser database-setup page.
    image: louislam/uptime-kuma:2.5.12@sha256:8e4b6bef96417ec98a35dc103c99cc64fc229a01e584e56d95d9004d2003c02a
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    restart: unless-stopped
    volumes:
      - uptimekuma_data:/app/data
    networks: [edge]

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
  uptimekuma_data:

networks:
  edge:
  backend:
  observability:
